[pytest]
DJANGO_SETTINGS_MODULE = cbeamd.settings
python_files = tests.py test_*.py *_tests.py
addopts = -v --tb=short
pythonpath = c-beamd
# whitenoise warns once per test client when STATIC_ROOT has not been collected;
# test_static.py covers the collected case explicitly
filterwarnings =
    ignore:No directory at.*static_collected:UserWarning
